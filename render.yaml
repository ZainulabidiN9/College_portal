services:
  - type: web
    name: college-portal
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python manage.py migrate --noinput && gunicorn college_portal.wsgi:application --access-logfile -
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.4
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
