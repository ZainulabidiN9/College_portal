<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Dashboard</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'portal.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIlIlkFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body class="portal-page">
    <!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Teacher Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h2>Teacher Dashboard</h2>

    <p>
        Welcome, {{ request.user.username }}
    </p>

    <div class="row mt-4">

        <div class="col-md-3 mb-3">
            <a href="{% url 'courses' %}"
               class="btn btn-primary w-100">
                View Courses
            </a>
        </div>

        <div class="col-md-3 mb-3">
            <a href="{% url 'attendance' %}"
               class="btn btn-success w-100">
                Attendance
            </a>
        </div>

        <div class="col-md-3 mb-3">
            <a href="{% url 'results' %}"
               class="btn btn-warning w-100">
                Results
            </a>
        </div>

        <div class="col-md-3 mb-3">
            <a href="{% url 'timetable' %}"
               class="btn btn-info w-100">
                Timetable
            </a>
        </div>

    </div>

</div>

</body>
</html>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoCGlyvwxVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
