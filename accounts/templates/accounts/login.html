<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Institute Portal</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'portal.css' %}">
  </head>
  <body class="portal-page">
    <main class="login-shell">
      <section class="login-intro" aria-label="Institute portal welcome">
        <h1>Welcome back to your portal.</h1>
        <p>Continue your academic journey and stay connected with your institute.</p>
      </section>

      <section class="login-content">
        <h2>Log in</h2>
        <p>Enter your details to access your account.</p>
        <form method="POST" class="portal-form">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="portal-button">Login</button>
        </form>
        <p class="login-signup">New here? <a href="{% url 'signup' %}">Create an account</a></p>
      </section>
    </main>
  </body>
</html>
