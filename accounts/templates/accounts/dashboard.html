<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose Dashboard | Institute Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
      .portal-header {
        background-color: #173b57;
        color: #ffffff;
        padding: 2rem 1rem;
        text-align: center;
      }

      .hero {
        min-height: calc(100vh - 116px);
        padding: 4rem 1.25rem;
        background: #eaf2f5;
      }

      .hero-actions {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1.25rem;
        width: min(100%, 960px);
        margin: 0 auto;
      }

      .hero-button {
        display: flex;
        min-height: 12rem;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        border: 1px solid #c7d5dc;
        border-radius: 0.5rem;
        background-color: #ffffff;
        color: #173b57;
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-align: center;
        text-decoration: none;
        box-shadow: 0 0.75rem 1.5rem rgba(23, 59, 87, 0.1);
        transition: background-color 180ms ease, color 180ms ease, transform 180ms ease, box-shadow 180ms ease;
      }

      .hero-button:hover,
      .hero-button:focus-visible {
        background-color: #8bd3dd;
        color: #102d42;
        transform: translateY(-2px);
        box-shadow: 0 1rem 2rem rgba(23, 59, 87, 0.18);
      }

      @media (max-width: 480px) {
        .hero-actions {
          width: min(100%, 24rem);
          flex-direction: column;
          grid-template-columns: 1fr;
        }

        .hero-button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="portal-header">
    <h1 class="fw-bold">Choose Your Dashboard</h1>
    <p class="mb-0">Welcome, {{ request.user.username }}. Select a portal area to continue.</p>

    </div>

    <div class="hero d-flex justify-content-center align-items-center">
      <div class="hero-actions">
        <a href="{% url 'admin_dashboard' %}" class="hero-button">Admin Dashboard</a>
        <a href="{% url 'teacher_dashboard' %}" class="hero-button">Teacher Dashboard</a>
        <a href="{% url 'student_dashboard' %}" class="hero-button">Student Dashboard</a>
      </div>
      <nav class="text-center mt-4" aria-label="Account navigation">
        <a href="{% url 'profile' %}" class="me-3">Profile</a>
        <a href="{% url 'logout' %}">Logout</a>
      </nav>
    </div>






    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
