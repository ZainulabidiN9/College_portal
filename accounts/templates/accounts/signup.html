<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account | Institute Portal</title>
    <style>
      :root {
        --ink: #173b57;
        --muted: #607487;
        --accent: #8bd3dd;
        --surface: #ffffff;
        --background: #eaf2f5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: linear-gradient(135deg, #dcecf0 0%, var(--background) 48%, #f7fbfc 100%);
        color: var(--ink);
        font-family: Georgia, 'Times New Roman', serif;
      }

      .signup-shell {
        width: min(100%, 960px);
        min-height: 590px;
        display: grid;
        grid-template-columns: 0.9fr 1.1fr;
        overflow: hidden;
        border: 1px solid rgba(23, 59, 87, 0.12);
        border-radius: 1rem;
        background: var(--surface);
        box-shadow: 0 1.5rem 4rem rgba(23, 59, 87, 0.18);
        animation: shell-in 700ms ease-out both;
      }

      .signup-intro {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        min-height: 590px;
        padding: 2.5rem;
        overflow: hidden;
        background: linear-gradient(rgba(12, 41, 61, 0.3), rgba(12, 41, 61, 0.78)), url('https://images.unsplash.com/photo-1758270705317-3ef6142d306f?w=1200&auto=format&fit=crop&q=90&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8c3R1ZGVudHMlMjBtYW5hZ2VtZW50JTIwc3lzdGVtfGVufDB8fDB8fHww') center / cover;
        color: #ffffff;
      }

      .signup-intro::after {
        content: '';
        position: absolute;
        width: 10rem;
        height: 10rem;
        top: 2rem;
        right: -3rem;
        border: 1px solid rgba(139, 211, 221, 0.7);
        border-radius: 50%;
        animation: float 5s ease-in-out infinite;
      }

      .eyebrow {
        position: relative;
        z-index: 1;
        margin: 0 0 0.75rem;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: bold;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .signup-intro h1 {
        position: relative;
        z-index: 1;
        max-width: 16rem;
        margin: 0;
        font-size: clamp(2rem, 4vw, 3.25rem);
        line-height: 1.05;
      }

      .signup-intro p {
        position: relative;
        z-index: 1;
        max-width: 19rem;
        margin: 1rem 0 0;
        color: rgba(255, 255, 255, 0.82);
        font-family: Arial, sans-serif;
        line-height: 1.6;
      }

      .signup-content {
        padding: clamp(2rem, 5vw, 4rem);
        align-self: center;
        animation: content-in 800ms 120ms ease-out both;
      }

      .signup-content h2 {
        margin: 0;
        font-size: clamp(1.8rem, 4vw, 2.5rem);
      }

      .signup-content > p {
        margin: 0.5rem 0 2rem;
        color: var(--muted);
        font-family: Arial, sans-serif;
        font-size: 0.95rem;
      }

      form p {
        margin: 0 0 1.15rem;
      }

      form label {
        display: block;
        margin-bottom: 0.45rem;
        color: var(--ink);
        font-family: Arial, sans-serif;
        font-size: 0.84rem;
        font-weight: 700;
      }

      form input {
        width: 100%;
        padding: 0.82rem 0.95rem;
        border: 1px solid #c7d5dc;
        border-radius: 0.45rem;
        background: #fbfdfe;
        color: var(--ink);
        font: 1rem Arial, sans-serif;
        outline: none;
        transition: border-color 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
      }

      form input:focus {
        border-color: #4b9bb0;
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(139, 211, 221, 0.25);
      }

      form ul {
        margin: 0.45rem 0 0;
        padding-left: 1rem;
        color: #b24848;
        font: 0.78rem/1.5 Arial, sans-serif;
      }

      .helptext {
        display: block;
        margin-top: 0.4rem;
        color: var(--muted);
        font: 0.76rem/1.45 Arial, sans-serif;
      }

      .submit-button {
        width: 100%;
        margin-top: 0.35rem;
        padding: 0.9rem 1.2rem;
        border: 0;
        border-radius: 0.45rem;
        background: var(--ink);
        color: #ffffff;
        cursor: pointer;
        font: 700 0.95rem Arial, sans-serif;
        letter-spacing: 0.04em;
        transition: background-color 180ms ease, transform 180ms ease, box-shadow 180ms ease;
      }

      .submit-button:hover,
      .submit-button:focus-visible {
        background: #245d7f;
        box-shadow: 0 0.6rem 1rem rgba(23, 59, 87, 0.2);
        transform: translateY(-2px);
      }

      .login-prompt {
        margin: 1.4rem 0 0;
        color: var(--muted);
        font: 0.88rem Arial, sans-serif;
        text-align: center;
      }

      .login-prompt a {
        color: #246b83;
        font-weight: 700;
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }

      @keyframes shell-in {
        from { opacity: 0; transform: translateY(1rem) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes content-in {
        from { opacity: 0; transform: translateX(1rem); }
        to { opacity: 1; transform: translateX(0); }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(1rem) rotate(8deg); }
      }

      @media (max-width: 720px) {
        body {
          padding: 1rem;
        }

        .signup-shell {
          display: block;
          min-height: auto;
        }

        .signup-intro {
          min-height: 250px;
          padding: 2rem;
        }

        .signup-intro h1 {
          max-width: 20rem;
          font-size: 2.25rem;
        }

        .signup-intro p {
          margin-top: 0.65rem;
        }

        .signup-content {
          padding: 2rem 1.5rem 2.25rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="signup-shell">
      <section class="signup-intro" aria-label="Institute portal welcome">
        <p class="eyebrow">Institute Portal</p>
        <h1>Start your journey with us.</h1>
        <p>Create your account to access courses, attendance, results, and your student profile.</p>
      </section>

      <section class="signup-content">
        <h2>Create account</h2>
        <p>Enter your details to get started.</p>

        <form method="POST">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="submit-button">Create Account</button>
        </form>

        <p class="login-prompt">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
      </section>
    </main>
  </body>
</html>
